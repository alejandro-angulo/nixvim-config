name: Build nixvim Configuration
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:25
      volumes:
        - "/nix:/nix"
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build default package
        run: |
          echo 'Building default package for x86_64-linux'
          nix --extra-experimental-features nix-command --extra-experimental-features flakes \
            build .#packages.x86_64-linux.default

      - name: Push build to attic
        run: |
          nix --extra-experimental-features nix-command --extra-experimental-features flakes run nixpkgs#attic-client \
            -- login gospel https://attic.kilonull.com ${{ secrets.ATTIC_PUSH_SECRET }}
          nix --extra-experimental-features nix-command --extra-experimental-features flakes run nixpkgs#attic-client \
            -- push --ignore-upstream-cache-filter gospel:nixvimConfigs ./result
